name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build CLI and Desktop App
        run: |
          EXTENSION=""
          GUI_LDFLAGS=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXTENSION=".exe"
            GUI_LDFLAGS="-H=windowsgui"
          fi
          CLI_OUTPUT="domain-analyzer-${{ matrix.goos }}-${{ matrix.goarch }}${EXTENSION}"
          GUI_OUTPUT="domain-analyzer-gui-${{ matrix.goos }}-${{ matrix.goarch }}${EXTENSION}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "$CLI_OUTPUT" ./cmd/cli
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="$GUI_LDFLAGS" -o "$GUI_OUTPUT" ./cmd/gui
          echo "CLI_BINARY_PATH=$CLI_OUTPUT" >> $GITHUB_ENV
          echo "GUI_BINARY_PATH=$GUI_OUTPUT" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: domain-analyzer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.CLI_BINARY_PATH }}
            ${{ env.GUI_BINARY_PATH }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
